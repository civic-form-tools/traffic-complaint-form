[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-complaint-form"
version = "0.2.0"
description = "Fill a police traffic complaint form from GitHub Actions; identity stays in Secrets, output PDF is AES-256 encrypted and emailed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "weasyprint>=62",
    "pikepdf>=8",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pypdf>=4",
    "pyyaml>=6",
    "mcp>=2.3",
    "httpx>=0.28",
    "uvicorn>=0.30",
]
mcp = [
    "mcp>=2.3",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.scripts]
traffic-complaint-form = "traffic_complaint_form.cli:main"
traffic-complaint-form-encrypt-case = "traffic_complaint_form.crypto:encrypt_case_main"
traffic-complaint-form-mcp = "traffic_complaint_form.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_complaint_form = ["templates/*.html", "templates/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
