name: Fill and send complaint form

on:
  workflow_dispatch:
    inputs:
      encrypted_case:
        description: "מטען מוצפן (sealed box, base64) של נתוני התיק - הערוץ היחיד לנתונים אמיתיים; ריק = נתוני דוגמה"
        required: false
        default: ""
      sample_data: {description: "מלא נתוני דוגמה בדייקניים (לבדיקת צינור)", type: boolean, default: true}
      dry_run: {description: "בנה והצפן בלבד, אל תשלח מייל", type: boolean, default: false}

permissions:
  contents: read

concurrency:
  group: fill-form
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: filing # required reviewers gate every run before secrets are exposed
    env:
      TEST_MODE: ${{ vars.TEST_MODE }}
      ENCRYPT_OUTPUT: ${{ vars.ENCRYPT_OUTPUT }}
      COMPLAINANT_FIRST_NAME: ${{ secrets.COMPLAINANT_FIRST_NAME }}
      COMPLAINANT_LAST_NAME: ${{ secrets.COMPLAINANT_LAST_NAME }}
      COMPLAINANT_ID: ${{ secrets.COMPLAINANT_ID }}
      COMPLAINANT_ADDRESS: ${{ secrets.COMPLAINANT_ADDRESS }}
      COMPLAINANT_PHONE: ${{ secrets.COMPLAINANT_PHONE }}
      PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      CASE_DATA_PRIVATE_KEY: ${{ secrets.CASE_DATA_PRIVATE_KEY }}
    steps:
      - name: Validate required secrets (names only, fail fast)
        run: |
          missing=""
          for name in COMPLAINANT_FIRST_NAME COMPLAINANT_LAST_NAME COMPLAINANT_ID COMPLAINANT_ADDRESS COMPLAINANT_PHONE; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ "${ENCRYPT_OUTPUT:-true}" != "false" ] && [ -z "$PDF_PASSWORD" ]; then missing="$missing PDF_PASSWORD"; fi
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            for name in RECIPIENT_EMAIL SMTP_USERNAME SMTP_APP_PASSWORD; do
              [ -z "${!name}" ] && missing="$missing $name"
            done
          fi
          if [ -n "${{ inputs.encrypted_case }}" ] && [ -z "$CASE_DATA_PRIVATE_KEY" ]; then missing="$missing CASE_DATA_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets (names only):$missing"
            exit 1
          fi
          echo "All required secrets are configured."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for WeasyPrint and Hebrew fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-noto-core fonts-dejavu

      - run: pip install -e .

      - name: Build case payload
        run: |
          if [ -n "${{ inputs.encrypted_case }}" ]; then
            printf '%s' '${{ inputs.encrypted_case }}' > /tmp/case.enc
            echo "MODE=encrypted" >> "$GITHUB_ENV"
          else
            echo "MODE=sample" >> "$GITHUB_ENV"
          fi

      - name: Fill, verify and send
        run: |
          set -e
          case "$MODE" in
            encrypted) python -m traffic_complaint_form --case-encrypted /tmp/case.enc --out-dir out ${DRY:+--dry-run} ;;
            sample)    python -m traffic_complaint_form --sample --out-dir out ${DRY:+--dry-run} ;;
          esac
        env:
          DRY: ${{ inputs.dry_run && '1' || '' }}

      - name: Post-run verification summary
        run: |
          python3 - <<'PY'
          import os, glob
          files = glob.glob("out/*.pdf")
          assert len(files) == 1, f"expected exactly one output PDF, found {files}"
          size = os.path.getsize(files[0])
          assert size > 10_000, f"output suspiciously small: {size}"
          import pikepdf
          if os.environ.get("ENCRYPT_OUTPUT", "true").lower() != "false":
              try:
                  pikepdf.open(files[0])
                  raise SystemExit("output opens WITHOUT a password - refusing to finish green")
              except pikepdf.PasswordError:
                  pass
          print(f"verification OK: one PDF, {size} bytes, encryption state as configured")
          PY
