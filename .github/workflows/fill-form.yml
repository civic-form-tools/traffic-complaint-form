name: Fill and send complaint form
run-name: fill-form ${{ inputs.dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: "Non-secret correlation id from the MCP dispatcher (random hex); appears in the run name only"
        required: false
        default: ""
      encrypted_case:
        description: "מטען מוצפן (sealed box, base64) של נתוני התיק - הערוץ היחיד לנתונים אמיתיים; ריק = נתוני דוגמה"
        required: false
        default: ""
      sample_data: {description: "מלא נתוני דוגמה בדייקניים (לבדיקת צינור)", type: boolean, default: true}
      validate_only: {description: "Validate configuration only; no PDF or email", type: boolean, default: false}
      dry_run: {description: "בנה והצפן בלבד, אל תשלח מייל", type: boolean, default: false}

permissions:
  contents: read
  actions: read # the daily-cap step counts this workflow's runs

concurrency:
  group: fill-form
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # required reviewers gate every run before secrets are exposed
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the daily dispatch cap
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_CAP: ${{ vars.MCP_DAILY_CAP || '10' }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          count="$(curl -sf --get \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fill-form.yml/runs" \
            --data-urlencode "created=>=${today}" --data-urlencode per_page=1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])')"
          echo "fill-form runs today (UTC day): $count (cap $DAILY_CAP, this run included)"
          if [ "$count" -gt "$DAILY_CAP" ]; then
            echo "Daily dispatch cap reached - refusing to run (abuse control, see docs/MCP.md)"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for WeasyPrint and Hebrew fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-noto-core fonts-dejavu

      - run: pip install -e .

      - name: Build case payload
        env:
          ENCRYPTED_CASE: ${{ inputs.encrypted_case }}
        run: |
          if [ -n "$ENCRYPTED_CASE" ]; then
            printf '%s' "$ENCRYPTED_CASE" > /tmp/case.enc
            echo "MODE=encrypted" >> "$GITHUB_ENV"
          else
            echo "MODE=sample" >> "$GITHUB_ENV"
          fi

      - name: Fill, verify and send
        run: |
          set -e
          if [ "$VALIDATE_ONLY" = "true" ]; then
            python -m traffic_complaint_form --validate-config
            exit 0
          fi
          case "$MODE" in
            encrypted) python -m traffic_complaint_form --case-encrypted /tmp/case.enc --out-dir out ${DRY:+--dry-run} ;;
            sample)    python -m traffic_complaint_form --sample --out-dir out ${DRY:+--dry-run} ;;
          esac
        env:
          # Both secrets exist ONLY as protected `production` environment secrets
          # (no repository-level copies); this step is their sole exposure point.
          FILING_BUNDLE: ${{ secrets.FILING_BUNDLE }}
          CASE_DATA_PRIVATE_KEY: ${{ secrets.CASE_DATA_PRIVATE_KEY }}
          TEST_MODE: ${{ inputs.encrypted_case == '' && 'true' || vars.TEST_MODE }}
          ENCRYPT_OUTPUT: ${{ vars.ENCRYPT_OUTPUT }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          DRY: ${{ inputs.dry_run && '1' || '' }}

      - name: Post-run verification summary
        if: ${{ !inputs.validate_only }}
        run: |
          python3 - <<'PY'
          import os, glob
          files = glob.glob("out/*.pdf")
          assert len(files) == 1, f"expected exactly one output PDF, found {files}"
          size = os.path.getsize(files[0])
          assert size > 10_000, f"output suspiciously small: {size}"
          import pikepdf
          try:
              pikepdf.open(files[0])
              raise SystemExit("output opens WITHOUT a password - refusing to finish green")
          except pikepdf.PasswordError:
              pass
          print(f"verification OK: one PDF, {size} bytes, encryption state as configured")
          PY
